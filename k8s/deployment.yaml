apiVersion: apps/v1
kind: Deployment

metadata:
  name: engineering-rag

spec:
  replicas: 2

  selector:
    matchLabels:
      app: engineering-rag

  template:
    metadata:
      labels:
        app: engineering-rag

    spec:
      containers:
        - name: engineering-rag
          image: engineering-knowledge-rag:latest

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 20
